# v* 태그를 push 하면 macOS universal 바이너리를 GitHub Release 에 올리고 Homebrew tap 을 갱신한다.
# tap 갱신에는 <owner>/homebrew-hunsu 저장소와, 그 저장소에 쓸 수 있는 토큰(HOMEBREW_TAP_TOKEN 비밀값)이 필요하다. 없으면 건너뛴다.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: |
          go test ./...
          node --test web/
      - name: Build universal binary
        run: |
          version="${GITHUB_REF_NAME#v}"
          for arch in arm64 amd64; do
            GOOS=darwin GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=$version" -o "hunsu-$arch" .
          done
          lipo -create -output hunsu hunsu-arm64 hunsu-amd64
          tar -czf "hunsu-$version-darwin-universal.tar.gz" hunsu
          shasum -a 256 "hunsu-$version-darwin-universal.tar.gz" | cut -d' ' -f1 > sha256.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "hunsu-${GITHUB_REF_NAME#v}-darwin-universal.tar.gz" --title "$GITHUB_REF_NAME" --generate-notes
      - name: Update Homebrew tap
        if: env.TAP_TOKEN != ''
        run: |
          version="${GITHUB_REF_NAME#v}"
          sha="$(cat sha256.txt)"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/homebrew-hunsu.git" tap
          mkdir -p tap/Formula
          cat > tap/Formula/hunsu.rb <<EOF
          class Hunsu < Formula
            desc "Local HTML design tool: edit pages by hand or let an LLM build them"
            homepage "https://github.com/${GITHUB_REPOSITORY}"
            url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${version}/hunsu-${version}-darwin-universal.tar.gz"
            sha256 "${sha}"
            version "${version}"
            depends_on :macos

            def install
              bin.install "hunsu"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/hunsu -version")
            end
          end
          EOF
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/hunsu.rb
          git commit -m "hunsu ${version}"
          git push
