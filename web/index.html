<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hunsu</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='12' cy='16' r='9' fill='%2314161c' stroke='%23e0a64b' stroke-width='2'/%3E%3Ccircle cx='21' cy='16' r='9' fill='%23ece8df'/%3E%3C/svg%3E">
<link rel="stylesheet" href="vendor/codemirror/codemirror.min.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<nav class="files" aria-label="파일">
  <header class="brand">
    <svg viewBox="0 0 32 20" aria-hidden="true">
      <circle cx="10" cy="10" r="8" class="stone-black"/>
      <circle cx="21" cy="10" r="8" class="stone-white"/>
    </svg>
    <span>hunsu</span>
  </header>
  <h2>디자인 시스템</h2>
  <ul id="design-system"></ul>
  <h2>페이지</h2>
  <ul id="pages"></ul>
  <form id="new-page">
    <input name="name" placeholder="새 페이지 이름" aria-label="새 페이지 이름" required>
    <button>추가</button>
  </form>
  <h2>에셋</h2>
  <ul id="assets"></ul>
  <label class="upload" title="이미지·폰트를 화면에 끌어다 놓아도 된다">
    <input type="file" multiple accept=".png,.jpg,.jpeg,.gif,.webp,.avif,.svg,.woff,.woff2,.ttf,.otf">
    이미지·폰트 올리기
  </label>
</nav>
<main class="preview">
  <div class="bar">
    <button class="icon" data-panel="files" title="파일 목록 접기/펴기" aria-label="파일 목록">
      <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="13" rx="2"/><path d="M7.5 3.5v13"/></svg>
    </button>
    <div class="segmented tools" role="group" aria-label="렌더 화면 도구">
      <button class="icon" data-tool="select" aria-pressed="true" title="선택 (V) · 클릭해서 구성 요소를 고르고, 더블클릭해서 문구를 고친다" aria-label="선택 도구">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.04 4.69a.5.5 0 0 1 .65-.65l16 6.5a.5.5 0 0 1-.06.95l-6.13 1.58a2 2 0 0 0-1.43 1.43l-1.58 6.13a.5.5 0 0 1-.95.06z"/></svg>
      </button>
      <button class="icon" data-tool="hand" aria-pressed="false" title="손 (H) · 끌어서 페이지 안을 이동한다. 클릭은 그대로 동작" aria-label="손 도구">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 11V6a2 2 0 0 0-4 0"/><path d="M14 10V4a2 2 0 0 0-4 0v2"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-6-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>
      </button>
    </div>
    <div class="segmented" role="group" aria-label="미리보기 너비">
      <button data-width="390" aria-pressed="false">모바일</button>
      <button data-width="" aria-pressed="true">데스크톱</button>
    </div>
    <div class="zoom" role="group" aria-label="확대/축소">
      <button class="icon" data-zoom="-1" title="축소 (⌘−)" aria-label="축소">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 10h10"/></svg>
      </button>
      <button id="zoom-level" title="100% 로 돌아가기 (⌘0)">100%</button>
      <button class="icon" data-zoom="1" title="확대 (⌘+)" aria-label="확대">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 10h10M10 5v10"/></svg>
      </button>
    </div>
    <span class="spacer"></span>
    <details class="menu" id="export">
      <summary>내보내기</summary>
      <div class="menu-items">
        <button data-export="html" data-page>이 페이지 · HTML 파일 하나</button>
        <button data-export="png" data-page>이 페이지 · PNG</button>
        <button data-export="zip">전체 폴더 · ZIP</button>
      </div>
    </details>
    <button class="icon" data-panel="focus" title="렌더만 보기 (⌘\)" aria-label="렌더만 보기">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 7.5V3h4.5M17 7.5V3h-4.5M3 12.5V17h4.5M17 12.5V17h-4.5"/></svg>
    </button>
    <button class="icon" data-panel="source" title="편집기·채팅 접기/펴기" aria-label="편집기와 채팅">
      <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="13" rx="2"/><path d="M12.5 3.5v13"/></svg>
    </button>
  </div>
  <div class="stage"><div class="frame-box"><iframe id="frame" title="렌더 화면"></iframe></div></div>
  <div class="resizer" data-resize="files" role="separator" aria-orientation="vertical" aria-label="파일 패널 너비" aria-valuemin="160" aria-valuemax="480" tabindex="0" title="끌어서 크기 조절, 더블클릭하면 기본 크기"></div>
  <div class="resizer" data-resize="source" role="separator" aria-orientation="vertical" aria-label="편집기·채팅 패널 너비" aria-valuemin="320" aria-valuemax="900" tabindex="0" title="끌어서 크기 조절, 더블클릭하면 기본 크기"></div>
</main>
<section class="source" aria-label="편집기와 채팅">
  <div class="bar">
    <span id="open-path"></span>
    <button id="save">저장</button>
  </div>
  <div id="editor"></div>
  <section class="chat" aria-label="채팅">
    <div class="resizer" data-resize="chat" role="separator" aria-orientation="horizontal" aria-label="채팅 높이" aria-valuemin="120" aria-valuemax="800" tabindex="0" title="끌어서 크기 조절, 더블클릭하면 기본 크기"></div>
    <ol id="messages"></ol>
    <form id="prompt">
      <div id="selection" class="chip" hidden>
        <span>선택</span><code></code>
        <button type="button" aria-label="선택 해제" title="선택 해제 (Esc)">×</button>
      </div>
      <textarea name="prompt" rows="3" placeholder="무엇을 만들거나 고칠까요? (Enter 보내기, Shift+Enter 줄바꿈)" aria-label="요청"></textarea>
      <div class="actions">
        <select name="model" aria-label="모델"></select>
        <button type="button" id="undo">되돌리기</button>
        <button type="button" id="new-chat">새 대화</button>
        <button id="send" class="primary">보내기</button>
      </div>
    </form>
  </section>
</section>
<p id="status" role="status"></p>
<script src="vendor/codemirror/codemirror.min.js"></script>
<script src="vendor/codemirror/mode/xml/xml.min.js"></script>
<script src="vendor/codemirror/mode/javascript/javascript.min.js"></script>
<script src="vendor/codemirror/mode/css/css.min.js"></script>
<script src="vendor/codemirror/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="vendor/codemirror/mode/markdown/markdown.min.js"></script>
<script type="module" src="app.mjs"></script>
</body>
</html>
